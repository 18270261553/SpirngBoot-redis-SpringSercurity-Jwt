server:
  port: 2026
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/study?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&tinyInt1isBit=false&allowLoadLocalInfile=true&allowLocalInfile=true&allow
    password: 123456
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      port: 6379
      host: localhost
      password:
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
# ============ 新增 JWT 配置 ============
jwt:
  secret: demo2-jwt-secret-key-must-be-at-least-256-bits-long-1234567890
  expiration: 3600  # 1小时（秒）
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.demo2.entity
  configuration:
    map-underscore-to-camel-case: true
